name: jarvis-cron

# Phase 3+: the bot lives on Render; this cron is just the free scheduler.
# It curls the server's run endpoints (which also wakes the free instance from
# spin-down — hence generous retries/timeouts).
on:
  schedule:
    # 7:00 AM EDT (11:00 UTC) morning · 9:00 PM EDT (01:00 UTC next day) evening
    # 4:30 PM EDT Sunday (20:30 UTC) summarizer
    # NOTE: cron is UTC — after the November DST change these fire 1hr early ET; adjust then.
    - cron: "0 11 * * *"
    - cron: "0 1 * * *"
    - cron: "30 20 * * 0"
  workflow_dispatch:
    inputs:
      run_type:
        description: "Which run to execute"
        type: choice
        options: [morning, evening, sunday]
        default: morning

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Decide run type
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_type=${{ inputs.run_type }}" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%H)" -lt 6 ]; then
            echo "run_type=evening" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%H)" -ge 19 ]; then
            echo "run_type=sunday" >> "$GITHUB_OUTPUT"
          else
            echo "run_type=morning" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger run on Render (retries cover cold start)
        run: |
          curl -fsS -X POST \
            "${{ secrets.RENDER_URL }}/api/run/${{ steps.decide.outputs.run_type }}" \
            -H "X-Run-Token: ${{ secrets.RUN_TOKEN }}" \
            --max-time 240 --retry 4 --retry-delay 20 --retry-all-errors
