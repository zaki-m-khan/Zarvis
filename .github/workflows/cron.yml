name: jarvis-cron

on:
  schedule:
    # 7:00 AM EDT (11:00 UTC) and 9:00 PM EDT (01:00 UTC next day).
    # NOTE: cron is UTC — after the November DST change these fire 1hr early ET; adjust then.
    - cron: "0 11 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      run_type:
        description: "Which run to execute"
        type: choice
        options: [morning, evening]
        default: morning

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Persist jarvis.db between runs (restore latest, save under a fresh key each run)
      - uses: actions/cache@v4
        with:
          path: jarvis.db
          key: jarvis-db-${{ github.run_id }}
          restore-keys: jarvis-db-

      - name: Decide run type
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_type=${{ inputs.run_type }}" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%H)" -lt 6 ]; then
            echo "run_type=evening" >> "$GITHUB_OUTPUT"
          else
            echo "run_type=morning" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore Google token (optional)
        if: ${{ env.GOOGLE_TOKEN_JSON != '' }}
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: echo "$GOOGLE_TOKEN_JSON" > token.json

      - name: Run Jarvis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATABASE_PATH: ./jarvis.db
        run: python -m src.runs.${{ steps.decide.outputs.run_type }}
